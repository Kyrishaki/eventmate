<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="goldCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgCol)" />
  <!-- Standee item on left -->
  <rect x="95" y="135" width="195" height="310" rx="16" fill="#1E1B4B" stroke="#C084FC" stroke-width="4" />
  <ellipse cx="192" cy="450" rx="95" ry="22" fill="#3B0764" stroke="url(#goldCol)" stroke-width="3" />
  <circle cx="192" cy="245" r="46" fill="#7E22CE" stroke="#FDE047" stroke-width="3" />
  <text x="192" y="365" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#E9D5FF">STANDEE 16CM</text>
  <!-- Keychain item on right -->
  <circle cx="415" cy="145" r="18" fill="none" stroke="url(#goldCol)" stroke-width="6" />
  <rect x="335" y="175" width="160" height="220" rx="22" fill="#3B0764" stroke="url(#goldCol)" stroke-width="4" />
  <circle cx="415" cy="265" r="40" fill="#EF4444" stroke="#FDE047" stroke-width="3" />
  <text x="415" y="355" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#FDE047">KEYCHAIN HOLO</text>
  <!-- Bottom Collab Title -->
  <rect x="80" y="495" width="440" height="52" rx="10" fill="url(#goldCol)" />
  <text x="300" y="527" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="17" fill="#1E1B4B" letter-spacing="1">LIMBUS COMPANY × GENZ STUDIO SET</text>
  <!-- Top Badge -->
  <rect x="30" y="30" width="180" height="34" rx="17" fill="#A855F7" />
  <text x="120" y="52" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">COLLAB FESTIVAL SET</text>
</svg>