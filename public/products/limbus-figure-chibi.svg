  <rect x="30" y="30" width="165" height="34" rx="17" fill="#D97706" />
  <text x="112" y="52" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">FIGURE CHÍNH HÃNG</text>
