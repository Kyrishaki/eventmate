  <text x="300" y="462" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#FDE68A">DANTE / DON QUIXOTE / FAUST</text>
  <text x="300" y="488" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">PVC/ABS Figure 10cm • Official Box</text>
