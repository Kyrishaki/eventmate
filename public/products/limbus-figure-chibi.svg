  <path d="M255 320 L345 320 L360 395 L240 395 Z" fill="#991B1B" stroke="#FBBF24" stroke-width="3" />
  <line x1="300" y1="320" x2="300" y2="395" stroke="#FBBF24" stroke-width="3" />
  <!-- Figure Pedestal -->
