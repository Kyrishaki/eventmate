      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="boxRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgFig)" />
  <!-- Collector Box Background -->
  <rect x="135" y="85" width="330" height="430" rx="14" fill="#1F1F23" stroke="#F59E0B" stroke-width="4" />
  <rect x="155" y="105" width="290" height="60" rx="8" fill="url(#boxRed)" />
  <text x="300" y="132" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" letter-spacing="2">LIMBUS COMPANY</text>
  <text x="300" y="153" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#FDE68A" letter-spacing="1">CHIBI FIGURE SERIES #10</text>
  <!-- Display Window -->
  <rect x="165" y="180" width="270" height="250" rx="12" fill="#09090B" stroke="#D97706" stroke-width="2" />
  <!-- Chibi Figure Silhouette (Dante / Don Quixote) -->
  <!-- Chibi Head -->
  <circle cx="300" cy="265" r="52" fill="#DC2626" stroke="#FBBF24" stroke-width="4" />
  <circle cx="300" cy="265" r="36" fill="#18181B" stroke="#FDE68A" stroke-width="2" />
