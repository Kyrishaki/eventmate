<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14090B" />
      <stop offset="50%" stop-color="#2A1015" />
      <stop offset="100%" stop-color="#0D0D12" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="acrylic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <!-- Subtle clockwork background -->
  <circle cx="300" cy="320" r="220" fill="none" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="300" cy="320" r="185" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.2" />
  <!-- Golden Clasp & Chain -->
  <circle cx="300" cy="85" r="28" fill="none" stroke="url(#gold)" stroke-width="10" />
  <path d="M292 55 L308 55 L304 40 L296 40 Z" fill="url(#gold)" />
  <rect x="293" y="108" width="14" height="32" rx="7" fill="none" stroke="url(#gold)" stroke-width="6" />
  <rect x="293" y="132" width="14" height="32" rx="7" fill="none" stroke="url(#gold)" stroke-width="6" />
  <!-- Acrylic Keychain Outer Border -->
  <path d="M180 185 L420 185 L455 235 L435 465 L300 520 L165 465 L145 235 Z" fill="url(#acrylic)" stroke="#FBBF24" stroke-width="4" />
  <path d="M192 198 L408 198 L438 242 L420 452 L300 502 L180 452 L162 242 Z" fill="#180B0E" stroke="#EF4444" stroke-width="2" stroke-opacity="0.7" />
  <!-- Keyhole tab -->
  <circle cx="300" cy="175" r="18" fill="url(#acrylic)" stroke="#FBBF24" stroke-width="3" />
  <circle cx="300" cy="175" r="7" fill="#14090B" />
  <!-- Dante Clock Emblem & Sinners Art -->
  <circle cx="300" cy="310" r="75" fill="url(#crimson)" stroke="url(#gold)" stroke-width="4" />
  <circle cx="300" cy="310" r="60" fill="#1A0A0D" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- Clock hands -->
  <line x1="300" y1="310" x2="300" y2="262" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" />
  <line x1="300" y1="310" x2="338" y2="328" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  <circle cx="300" cy="310" r="8" fill="#FDE68A" />
  <!-- Flame crown -->
  <path d="M245 245 Q270 205 300 225 Q330 205 355 245 Q335 235 300 242 Q265 235 245 245 Z" fill="#EF4444" />
  <!-- Text Labels -->
  <rect x="200" y="405" width="200" height="32" rx="6" fill="url(#gold)" />
  <text x="300" y="426" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#14090B" letter-spacing="1.5">LIMBUS COMPANY</text>
  <text x="300" y="462" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#FDE68A" letter-spacing="1">12 SINNERS ACRYLIC KEYCHAIN</text>
  <!-- Sparkles -->
  <circle cx="210" cy="250" r="4" fill="#FDE68A" />
  <circle cx="395" cy="270" r="3" fill="#FDE68A" />
  <circle cx="220" cy="375" r="3.5" fill="#EF4444" />
  <circle cx="385" cy="370" r="4" fill="#FDE68A" />
  <!-- Top Corner Badge -->
  <rect x="30" y="30" width="150" height="34" rx="17" fill="#EF4444" />
  <text x="105" y="52" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">2-LAYER HOLOGRAM</text>
</svg>